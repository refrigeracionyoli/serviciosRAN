name: Deploy Supabase Edge Functions

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-supabase-functions
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy R2 functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase functions deploy r2-upload --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy r2-presigned-put --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy r2-presigned-get --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy r2-delete --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy admin functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase functions deploy admin-create-tecnico --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy admin-reset-empleado-password --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"
